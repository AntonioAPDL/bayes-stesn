  - id: P4
    title: Fixed-endpoint history curves and nested sensor comparisons
    acceptance_ids: [R11, R12]
    implemented:
      status: implemented_study_interfaces
      files:
        - src/bayes_stesn/benchmark/studies.py
        - src/bayes_stesn/benchmark/protocol.py
        - src/bayes_stesn/benchmark/runner.py
        - src/bayes_stesn/benchmark/cli.py
        - docs/study_design_v03.md
        - configs/benchmark/v03/studies/remaining_studies.yaml
        - configs/benchmark/v03/studies/prepare.py
        - configs/benchmark/v03/studies/README.md
        - configs/benchmark/v03/studies/run_chunks.py
        - tools/summarize_v03_learning_curves.py
      behavior:
        - Resolve the full history curve at a common endpoint before executing any subset.
        - Keep final times, target sites, generated fields, and common training-only normalization fixed.
        - Reserve the largest observed-site master set and preserve nested sensor identities and C/U roles.
        - Preserve fixed-specification and retuned-pipeline curves as different experiments.
        - Declare 330 initial history fits over five fields per G1/G3/G4 and 33 descriptive sensor fits on one G4 field; retain full unexecuted 500/4000 conditions.
        - Freeze the exploratory ESN-centered history promotion rule before outcomes, report paired effects for every compatible model, and preserve insufficient-evidence reasons.
        - Audit saved spatial and temporal rank/conditioning and fixed-reference geometry-only normalized-ridge noise amplification without changing actual fitted bases or priors.
      limitations:
        - Sensor geometry must support the largest requested panel and reserved evaluation roles.
        - Encoder/representation or capacity ablations require explicit separately frozen configurations.
    tests:
      - tests/test_benchmark_studies_v03.py
      - tests/test_benchmark_pipeline.py
      - tests/test_v03_study_tools.py
    executed:
      status: both_initial_history_conditions_and_all_sensor_conditions_complete
      evidence:
        - docs/evidence/v03/integrated_tests.xml
        - docs/evidence/v03/study_tool_tests.xml
        - docs/evidence/v03/generator_validation_long_history_grid64.json
        - docs/evidence/v03/scientific_review.json
        - results/v03/history/curve_design.json
        - results/v03/history/v03_fixed_history_history_1000/summary.json
        - results/v03/history/v03_fixed_history_history_2000/summary.json
        - docs/evidence/v03/history_choice.json
        - results/v03/sensors/curve_design.json
        - results/v03/sensors/v03_sensor_sensitivity_sensors_25/summary.json
        - results/v03/sensors/v03_sensor_sensitivity_sensors_50/summary.json
        - results/v03/sensors/v03_sensor_sensitivity_sensors_100/summary.json
        - docs/evidence/v03/sensor_representation.json
      scope: >-
        The 1000/2000 history conditions each have 165 terminal outcomes,
        respectively 163 and 164 qualified. The sealed exploratory rule selects
        1000. Track A passes the practical gain bound; Track B fails it despite
        a positive macro mean and has heterogeneous scenario effects. Each
        track has 4/5/5 common-qualified G1/G3/G4 pairs. Long-history
        qualification is not worse; incomplete short-history compute accounting
        independently fails the cost gate. Small-sample dataset-bootstrap
        intervals are pointwise, without a formal-coverage or simultaneity claim.
        All 33 sensor outcomes qualify on one G4 field at separately fixed
        initial history 2000. The representation audit is descriptive and
        has no across-field MCSE; its fixed-reference noise-amplification
        diagnostic does not change fitted bases, priors or forecasts.
        The long independent G3 numerical pilot passes the declared finite-grid
        time and nontrivial-activity checks over the full planned history span;
        mesh refinement fails and no continuum or all-initial-condition
        guarantee is inferred. Study-tool unit tests establish only the
        selection-rule arithmetic, algebra and integrity checks.
      unexecuted_optional_scope:
        - History500/4000 endpoints; curve shape outside 1000/2000 remains unresolved and additional endpoints do not restore missing timing or add independent fields.
        - Additional independent sensor fields, separately frozen encoder experiments and capacity/prior ablations.
      pending:
        - Final reporting and requirement disposition using the complete sealed audits and their limitations.
    scientific_conclusion:
      status: exploratory_history1000_choice_and_one_field_sensor_description
      statement: >-
        Retaining 1000 is the specified response to failed promotion gates,
        not evidence of no data benefit, saturation or no harm from older
        history. Recorded partial timing ratios do not establish complete
        measured speedups. Sensor geometry results do not establish a
        replicated sensor-benefit or forecast-accuracy claim.

  - id: P5
    title: Evidence-gated model and uncertainty extensions
    acceptance_ids: [R13]
    implemented:
      status: core_routes_retained_conditional_benchmark_extensions_gated
      files:
