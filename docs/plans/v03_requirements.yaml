overall:
  implemented: Staged engineering and study interfaces available; conditional extensions remain gated.
  executed: >-
    Recovered reference, six coordinate cases, bounded P5 and saved diagnostics,
    both initial history conditions, and all three sensor conditions are
    complete. Strict tuning has 59/60 qualified outcomes and one declared
    fallback; revised development has 220/220 qualified outcomes. All six
    preselected calibration cases and all three paired stress arms are complete.
    Confirmation is admitted at R=60 per scenario and in progress. Revised
    ordinary/comparison saved-artifact QA is complete; final synthesis and
    release gates remain pending.
  scientific_conclusion: >-
    The sealed exploratory rule retains history 1000: Track A meets the
    practical improvement bound, Track B fails it, and incomplete short-history
    accounting independently fails the cost gate. Sensors provide one-field
    descriptive evidence. Calibration shares one field and serial blocks;
