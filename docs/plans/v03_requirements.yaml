        - results/v03/coordinate-final/summary.json
        - results/v03/development/reference_final/summary.json
        - results/v03/development/tuned_final/summary.json
        - results/v03/development/tuned_final/g3_excitable_field/rep_000/A/basis_lgssm/selection.json
        - results/v03/development/tuned_final/g3_excitable_field/rep_000/A/basis_lgssm/receipt.json
      scope: >-
        The paired coordinate cases use one field each from G1/G3/G4 and the
        same original posterior targets; legacy qualifies 2/3 and transformed
        coordinates 3/3. The reference panel has 60/60 qualified outcomes.
        The complete tuning population has 59/60 qualified outcomes. Its
