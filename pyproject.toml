[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bayes-stesn"
version = "0.1.0"
description = "Auditable Bayesian spatiotemporal echo state networks"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "bayes-stesn contributors"}]
dependencies = ["numpy>=1.26,<3", "scipy>=1.13,<2", "PyYAML>=6,<7"]

[project.optional-dependencies]
report = ["matplotlib>=3.8,<4", "Pillow>=10,<13", "reportlab>=4.2,<5"]
dev = ["pytest>=8,<10", "build>=1,<2"]

[project.scripts]
bstesn = "bayes_stesn.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

