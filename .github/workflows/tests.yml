name: numerical-and-api-checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core:
    name: Core without PyTorch / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      MPLBACKEND: Agg
      MPLCONFIGDIR: /tmp/bstesn-mpl
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install project and test dependencies
        run: python -m pip install '.[report,dev]'
      - name: Prove the core runtime has no PyTorch dependency
        run: python -c "import importlib.util; assert importlib.util.find_spec('torch') is None; import bayes_stesn.benchmark"
      - name: Numerical, sampling and core workflow checks
        run: python -m pytest tests -k 'not DiffusionGRUTests and not TestBasisGRU' --junitxml=results/tests.xml
      - name: Installed command-line smoke reproduction
        run: bstesn demo --smoke --output results/cli_smoke
      - name: Lightweight benchmark smoke without PyTorch
        run: >-
          bstesn benchmark run --profile smoke
          --models persistence,seasonal_naive,basis_lgssm,separable_stgp,basis_krr,eqesn_rollout
          --scenarios g1_gaussian_ar --output results/benchmark_smoke
      - name: Source and wheel packaging
        run: python -m build
      - name: Dependency consistency
        run: python -m pip check

  neural-cpu:
    name: Optional CPU neural models / locked CPython 3.12
    runs-on: ubuntu-latest
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      MPLBACKEND: Agg
      MPLCONFIGDIR: /tmp/bstesn-neural-mpl
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements-core.lock
            requirements-dev.lock
            requirements-report.lock
            requirements-neural-cpu.lock
      - name: Install pinned release build tools
        run: python -m pip install --index-url https://pypi.org/simple -r requirements-dev.lock -r requirements-report.lock
      - name: Isolated CPU wheel, all optional tests, and benchmark execution gate
        run: >-
          python tools/release_check.py --with-neural
          --fresh-venv "${{ runner.temp }}/bstesn-neural-release"
          --output results/release_manifest_neural.json
